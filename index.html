<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#faf7f2" />
  <meta name="description" content="拾光集市：家居、数码、穿搭与食品好物精选，全场满 ¥199 免运费。" />
  <title>拾光集市 · 好物精选</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#products">跳到商品列表</a>

  <header class="site-header">
    <div class="nav-inner">
      <a class="logo" href="./" aria-label="拾光集市首页">
        <span class="logo-mark" aria-hidden="true"></span>
        <span class="logo-text">拾光集市</span>
      </a>

      <nav class="nav-links" aria-label="主导航">
        <a class="nav-link is-active" href="#products">全部好物</a>
        <a class="nav-link" href="#products">新品</a>
        <a class="nav-link" href="#products">品牌</a>
        <a class="nav-link" href="#products">关于</a>
      </nav>

      <div class="nav-actions">
        <label class="search" for="search-input">
          <span class="search-icon" aria-hidden="true">🔍</span>
          <input
            id="search-input"
            class="search-input"
            type="search"
            placeholder="搜索好物…"
            autocomplete="off"
            aria-label="搜索商品"
          />
        </label>

        <button
          class="cart-button"
          id="cart-open"
          type="button"
          aria-haspopup="dialog"
          aria-controls="cart-drawer"
          aria-expanded="false"
        >
          <span class="cart-button-icon" aria-hidden="true">🛍</span>
          <span class="cart-button-text">购物车</span>
          <span class="cart-badge" id="cart-badge" hidden>0</span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-card">
        <p class="hero-eyebrow">Autumn Drop 2026</p>
        <h1 class="hero-title" id="hero-title">把日子过成<br />喜欢的样子</h1>
        <p class="hero-desc">
          精选家居、数码与日常穿搭，全场满 ¥199 免运费，新客首单再减 ¥30。
        </p>
        <div class="hero-actions">
          <a class="btn btn-primary" href="#products">立即选购</a>
          <button class="btn btn-ghost" type="button" data-action="claim-coupon">领取新人券</button>
        </div>
        <ul class="hero-points">
          <li>48h 内发货</li>
          <li>7 天无理由退换</li>
          <li>顺丰包邮</li>
        </ul>
      </div>
    </section>

    <section class="catalog" id="products" aria-labelledby="catalog-title">
      <h2 class="visually-hidden" id="catalog-title">商品列表</h2>

      <div class="toolbar">
        <div class="chips" id="category-chips" role="tablist" aria-label="商品分类"></div>
        <p class="result-count" id="result-count" role="status" aria-live="polite"></p>
      </div>

      <div class="grid" id="product-grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>拾光集市 · 演示站点，商品与价格均为示例数据。</p>
  </footer>

  <div class="overlay" id="overlay"></div>

  <aside
    class="drawer"
    id="cart-drawer"
    role="dialog"
    aria-modal="true"
    aria-labelledby="cart-title"
    aria-hidden="true"
  >
    <header class="drawer-head">
      <h2 id="cart-title">购物车</h2>
      <button class="icon-button" id="cart-close" type="button" aria-label="关闭购物车">✕</button>
    </header>

    <div class="drawer-body" id="cart-items"></div>

    <footer class="drawer-foot">
      <p class="ship-hint" id="ship-hint"></p>
      <div class="total-row">
        <span>合计</span>
        <strong id="cart-total">¥0</strong>
      </div>
      <button class="btn btn-primary btn-block" id="checkout" type="button">去结算</button>
    </footer>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript>
    <p class="noscript">本页面需要启用 JavaScript 才能浏览商品与使用购物车。</p>
  </noscript>

  <script src="app.js"></script>
</body>
</html>
